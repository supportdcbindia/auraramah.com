  <meta name="robots" content="noindex, nofollow" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      background: #f6f7fb;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      max-width: 560px;
      width: 100%;
      text-align: center;
      padding: 56px 32px;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(16, 49, 117, 0.10);
      border-top: 5px solid #103175;
    }
    .icon {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: rgba(16, 49, 117, 0.08);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      margin-top: 24px;
      font-size: 30px;
      line-height: 1.25;
      color: #103175;
    }
    p {
      margin-top: 14px;
      color: #64748b;
      line-height: 1.7;
      font-size: 15px;
    }
    a.button {
      margin-top: 30px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #103175;
      color: #ffffff;
      padding: 15px 32px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.25s ease;
    }
    a.button:hover { background: #ff7400; }
    @media (max-width: 480px) {
      .card { padding: 40px 20px; }
      h1 { font-size: 24px; }
    }
  </style>
